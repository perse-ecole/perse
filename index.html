<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Persé — La Persévérance</title>
  <meta name="description" content="Espace personnel et Espace RH de La Persévérance.">
  <meta name="theme-color" content="#0e1a2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Persé">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <style>
    :root{--navy:#0e1a2b;--gold:#c4b48a;--paper:#fffcf8}
    *{box-sizing:border-box}
    html,body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:var(--navy);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--paper)}
    .ecran{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
      background:var(--navy);text-align:center}
    .ecran[hidden]{display:none}
    .logo{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px #0006}
    .titre{font-size:30px;font-weight:700;letter-spacing:.5px;color:var(--gold);margin:0}
    .sous{font-size:15px;opacity:.8;margin:0;max-width:320px;line-height:1.45}
    .roue{width:28px;height:28px;border-radius:50%;border:3px solid #ffffff33;border-top-color:var(--gold);
      animation:tourne 0.9s linear infinite}
    @keyframes tourne{to{transform:rotate(360deg)}}
    .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .actions[hidden]{display:none}
    .bouton{appearance:none;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:600;
      background:var(--gold);color:var(--navy);text-decoration:none;cursor:pointer}
    .bouton[hidden]{display:none}
    .bouton.secondaire{background:transparent;color:var(--paper);border:1px solid #ffffff55}
    @media (prefers-reduced-motion:reduce){.roue{animation:none}}
  </style>
</head>
<body>
  <div id="chargement" class="ecran" role="status" aria-live="polite">
    <img class="logo" src="icons/icon-192.png" alt="">
    <p class="titre">Persé</p>
    <div class="roue" aria-hidden="true"></div>
    <p class="sous">Ouverture de Persé…</p>
    <div class="actions" id="secours" hidden>
      <a class="bouton" id="lienPerse">Ouvrir Persé</a>
    </div>
  </div>

  <div id="accueil" class="ecran" hidden>
    <img class="logo" src="icons/icon-192.png" alt="">
    <p class="titre">Persé</p>
    <p class="sous" id="consigne">Installez Persé sur votre téléphone : menu ⋮ de Chrome, puis « Installer l'application ».</p>
    <div class="actions">
      <button class="bouton" type="button" id="installer" hidden>Installer l'appli</button>
      <a class="bouton secondaire" id="lienAccueil">Ouvrir Persé</a>
    </div>
  </div>

  <div id="horsLigne" class="ecran" hidden role="alert">
    <img class="logo" src="icons/icon-192.png" alt="">
    <p class="titre">Persé</p>
    <p class="sous">Pas de connexion Internet.<br>Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
    <div class="actions">
      <button class="bouton" type="button" id="reessayer">Réessayer</button>
    </div>
  </div>

  <script>
    (function () {
      var URL_PERSE = 'https://script.google.com/macros/s/AKfycbwn5KaqGAx-X1njorr4yquwyPJ9fHY-dZf9W8EaQKQuccaq4b3JcfpGzDtyCfIQ--8f3Q/exec';
      var PARAMS_TRANSMIS = ['ecran', 'espace'];
      var DELAI_REDIRECTION_MS = 400;
      var DELAI_SECOURS_MS = 4000;

      var chargement = document.getElementById('chargement');
      var accueil = document.getElementById('accueil');
      var horsLigne = document.getElementById('horsLigne');
      var secours = document.getElementById('secours');
      var boutonInstaller = document.getElementById('installer');
      var minuteurSecours = null;
      var invitationInstall = null;

      var installee = window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.navigator.standalone === true;
      var iphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      function adresseCible() {
        var entree = new URLSearchParams(location.search);
        var sortie = new URLSearchParams();
        PARAMS_TRANSMIS.forEach(function (cle) {
          var v = entree.get(cle);
          if (v && /^[\w-]{1,40}$/.test(v)) sortie.set(cle, v);
        });
        var q = sortie.toString();
        return URL_PERSE + (q ? '?' + q : '');
      }

      function demarrer() {
        clearTimeout(minuteurSecours);
        if (!navigator.onLine) {
          chargement.hidden = true;
          horsLigne.hidden = false;
          return;
        }
        horsLigne.hidden = true;
        var cible = adresseCible();
        document.getElementById('lienPerse').href = cible;
        document.getElementById('lienAccueil').href = cible;
        if (!installee) {
          chargement.hidden = true;
          accueil.hidden = false;
          return;
        }
        accueil.hidden = true;
        chargement.hidden = false;
        secours.hidden = true;
        setTimeout(function () { location.replace(cible); }, DELAI_REDIRECTION_MS);
        minuteurSecours = setTimeout(function () { secours.hidden = false; }, DELAI_SECOURS_MS);
      }

      if (iphone) {
        document.getElementById('consigne').textContent =
          'Installez Persé sur votre iPhone : dans Safari, touchez Partager puis « Sur l\u2019écran d\u2019accueil ».';
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        invitationInstall = e;
        boutonInstaller.hidden = false;
      });
      boutonInstaller.addEventListener('click', function () {
        if (!invitationInstall) return;
        invitationInstall.prompt();
        invitationInstall.userChoice.then(function () {
          invitationInstall = null;
          boutonInstaller.hidden = true;
        });
      });
      window.addEventListener('appinstalled', function () {
        boutonInstaller.hidden = true;
        document.getElementById('consigne').textContent =
          'Persé est installé. Ouvrez-le depuis l\u2019icône de votre écran d\u2019accueil.';
      });

      document.getElementById('reessayer').addEventListener('click', demarrer);
      window.addEventListener('online', function () { if (!horsLigne.hidden) demarrer(); });
      window.addEventListener('pageshow', function (e) { if (e.persisted) demarrer(); });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }

      demarrer();
    })();
  </script>
</body>
</html>
